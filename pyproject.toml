[project]
name = "ragaz"
version = "0.1.0"
description = "GRPO with a raga-grammar verifier: teaching small LLMs Hindustani ragas"
readme = "README.md"
authors = [
    { name = "yadavdevv", email = "devesh.yad02@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mlx-lm>=0.32.0",
    "numpy>=2.5.3",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "trackio>=0.40.0",
]

[project.scripts]
ragaz = "ragaz.cli:main"

[project.optional-dependencies]
wandb = [
    "wandb>=0.30.0",
]
mlflow = [
    "mlflow>=3.17.0",
]
voice = [
    "torch>=2.14.1",
    "torchcrepe>=0.0.24",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "remotezip>=0.12.6",
]
