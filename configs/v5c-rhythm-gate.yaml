# v5c: like v5b, but rhythm is a multiplier (reward × (0.4 + 0.6·rhythm)). In v5b, as a 0.2
# weight, GRPO traded rhythm away (eval 0.36 → 0.15 in 20 steps). Same start: rhythm-SFT best.
name: v5c-rhythm-gate
model: mlx-community/Qwen3-0.6B-bf16
tracker: trackio
init_adapter: runs/grpo/v5-sft-rhythm-b-20261024-1651/checkpoints/best
ragas: [bhupali, yaman, malkauns, deshkar]
reward_style: v5
rhythm_prompt: true
target_bars: 8

steps: 60
prompts_per_step: 4
group_size: 8
temperature: 1.0
max_tokens: 160

lr: 1.0e-5
warmup_steps: 5
beta: 0.04
lora_rank: 16
lora_layers: 16
duplicate_penalty: 0.5
novelty_ref: data/distilled_v4.jsonl
novelty_weight: 0.3
group_profile_weight: 0.4

hint_start: 0.3
hint_end: 0.3

eval_every: 10
eval_samples: 24
save_every: 10
best_metric: eval/bare/real_twin_score
micro_batch: 2
gen_batch: 8
memory_gb: 4
hard_memory_gb: 8
