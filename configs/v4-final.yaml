# Final v4: GRPO from the SFT-anchored checkpoint (twin 87%, large test), hybrid reward,
# hints held at 30% instead of fading to ~0 (fading is when v4 forgot Deshkar).
# Checkpoints picked by score × realism × twin accuracy.
name: v4-final
model: mlx-community/Qwen3-0.6B-bf16
tracker: trackio
init_adapter: runs/grpo/v4-sft-20261009-2250/checkpoints/step00030
ragas: [bhupali, yaman, malkauns, deshkar]

steps: 60
prompts_per_step: 4
group_size: 8
temperature: 1.0
max_tokens: 120

lr: 1.0e-5
warmup_steps: 5
beta: 0.04
lora_rank: 16
lora_layers: 16
duplicate_penalty: 0.5
novelty_ref: data/distilled_v4.jsonl
novelty_weight: 0.3
reward_style: v4
group_profile_weight: 0.4

hint_start: 0.3
hint_end: 0.3            # held, not faded

eval_every: 10
eval_samples: 24         # less noisy twin test (was 16)
save_every: 10
best_metric: eval/bare/real_twin_score
micro_batch: 2
gen_batch: 8
memory_gb: 5
hard_memory_gb: 8
