# Track B, step 1: context distillation. Teach name-only (bare) prompts to produce
# the compositions the hinted model wrote. Fresh LoRA on the base model.
name: track-b-sft
model: mlx-community/Qwen3-0.6B-bf16
tracker: trackio

sft_data: data/distilled.jsonl
sft_epochs: 3
sft_variants: [bare]
prompts_per_step: 4      # SFT batch = prompts_per_step × group_size = 16
group_size: 4

lr: 1.0e-4               # SFT tolerates a higher LR than RL
warmup_steps: 5
beta: 0.0                # no reference model needed for SFT
lora_rank: 16
lora_layers: 16
max_tokens: 120

eval_every: 10
eval_samples: 16
save_every: 10
best_metric: eval/bare/reward
micro_batch: 4
gen_batch: 8
memory_gb: 5
hard_memory_gb: 8
