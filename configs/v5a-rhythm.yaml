# v5a: real-music rhythm. Real performances mix quick notes (median 0.21 s) with long holds
# (duration spread CV ~1.1–1.5); v4 pieces are metronomic (rhythm score 0.00). Reward v5 =
# v4 hybrid + rhythm (duration shape + spread, calibrated on real excerpts). The prompt now
# asks for quick runs and held notes. Still 8 bars; 16 comes in v5b.
name: v5a-rhythm
model: mlx-community/Qwen3-0.6B-bf16
tracker: trackio
init_adapter: runs/grpo/v4-final-20261009-2257/checkpoints/best
ragas: [bhupali, yaman, malkauns, deshkar]
reward_style: v5
rhythm_prompt: true
target_bars: 8

steps: 80
prompts_per_step: 4
group_size: 8
temperature: 1.0
max_tokens: 160

lr: 1.0e-5
warmup_steps: 5
beta: 0.04
lora_rank: 16
lora_layers: 16
duplicate_penalty: 0.5
novelty_ref: data/distilled_v4.jsonl
novelty_weight: 0.3
group_profile_weight: 0.4

hint_start: 0.3
hint_end: 0.3

eval_every: 10
eval_samples: 24
save_every: 10
best_metric: eval/bare/real_twin_score
micro_batch: 2
gen_batch: 8
memory_gb: 5
hard_memory_gb: 8
