# v5e: GRPO polish of 16-bar pieces from the long SFT (16 bars 61/64, upper Sa 63/64,
# register 0.98, rhythm 0.49). Reward v5 = hybrid + rhythm multiplier + register + arc.
# Outputs ~2× longer than 8 bars: small batches; the governor paces by free memory.
name: v5e-long-grpo
model: mlx-community/Qwen3-0.6B-bf16
tracker: trackio
init_adapter: runs/grpo/v5-sft-long-20261024-1928/checkpoints/best
ragas: [bhupali, yaman, malkauns, deshkar]
reward_style: v5
rhythm_prompt: true
target_bars: 16

steps: 50
prompts_per_step: 4
group_size: 8
temperature: 1.0
max_tokens: 320

lr: 1.0e-5
warmup_steps: 5
beta: 0.04
lora_rank: 16
lora_layers: 16
duplicate_penalty: 0.5
novelty_ref: data/distilled_v4.jsonl
novelty_weight: 0.3
group_profile_weight: 0.4

hint_start: 0.3
hint_end: 0.3

eval_every: 10
eval_samples: 16
save_every: 10
best_metric: eval/bare/real_twin_score
micro_batch: 1
gen_batch: 4
memory_gb: 4
hard_memory_gb: 7
